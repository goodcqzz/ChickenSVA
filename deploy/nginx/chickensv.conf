# ChickenSV / ProjectAi3 — Nginx 反代（systemd 部署，非 Docker）
#
# 安装（安置机）:
#   sudo apt install -y nginx
#   sudo cp deploy/nginx/chickensv.conf /etc/nginx/sites-available/chickensv
#   sudo ln -sf /etc/nginx/sites-available/chickensv /etc/nginx/sites-enabled/chickensv
#   sudo rm -f /etc/nginx/sites-enabled/default   # 可选，避免 80 端口冲突
#   sudo nginx -t && sudo systemctl reload nginx
#
# 访问: http://<服务器IP>:9800/
# MCP(9802) 与 Backend(9801) 仅本机，勿对公网开放。

upstream chickensv_backend {
    server 127.0.0.1:9801;
    keepalive 32;
}

server {
    # 监听端口由部署时的 CHICKENSV_PUBLIC_PORT 决定（默认 9800）。
    # 学校反代要求「发布用 80」时：先把 Dify 从 80 挪到本地端口，再用
    #   CHICKENSV_PUBLIC_PORT=80 bash deploy/install-nginx.sh
    # server_name _ 作为默认站点匹配任意域名，无需写死学校分配的域名。
    listen @@CHICKENSV_PUBLIC_PORT@@;
    listen [::]:@@CHICKENSV_PUBLIC_PORT@@;
    server_name _;

    root @@CHICKENSV_ROOT@@/agent_framework/frontend/dist;
    index index.html;

    # 上传体积上限（防超大上传内存/磁盘 DoS）。后端按 WORKSPACE_MAX_UPLOAD_MB
    # 流式增量校验（默认 5MB）；此处留一定余量即可，勿设过大。
    client_max_body_size 64m;

    # 安全响应头（静态页与反代统一添加；扫描器对 GET / 也会检查这些头）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' ws: wss:; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    # HSTS 仅在 HTTPS 站点启用（见下方 443 模板块）；纯 HTTP:80 不要加，否则浏览器会强制走 HTTPS 导致站点不可用。

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 REST API（保留 /api 前缀）
    location /api/ {
        proxy_pass http://chickensv_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # WebSocket（对话 / Agent）
    location /ws/ {
        proxy_pass http://chickensv_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 可选：禁止直接访问 docs（生产 DEBUG=false 时后端本身也不暴露）
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }
}

